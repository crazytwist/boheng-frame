# boheng 前端 Nginx 配置：托管静态 + 反代 API/WebSocket 到后端
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- gzip：公网穿透时首屏 JS 有 1.5MB，不开压缩会非常慢 ----------
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1k;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml
                      image/svg+xml font/ttf font/otf;

    # ---------- WebSocket：后端注册在 /infra/ws（application.yaml:299）----------
    # 注意：必须走 proxy_http_version 1.1 并透传 Upgrade/Connection，
    # 否则握手无法完成；proxy_read_timeout 要远大于默认值，否则长连接会被掐断。
    location /infra/ws {
        proxy_pass http://boheng.server:48080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端 API 反代 → 后端容器
    location /admin-api/ {
        proxy_pass http://boheng.server:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # app 侧 API 反代（设备任务等 /app-api 接口）
    location /app-api/ {
        proxy_pass http://boheng.server:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # SPA 路由回退（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
